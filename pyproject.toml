[project]
name = "cycplussync"
version = "0.1.0"
description = "Sync FIT files from CycPlus M1 bicycle computer via BLE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleak>=3.1.0",
]

[project.scripts]
cycplussync = "cycplussync:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
